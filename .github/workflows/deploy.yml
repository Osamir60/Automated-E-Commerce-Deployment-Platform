name: CI/CD Pipeline to EKS & ECR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - frontend
          - product-service
          - cart-service
          - search-service
          - payment-service
          - email-service

    steps:
      # ==========================================
      # 1. Checkout Code
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ==========================================
      # 2. Configure AWS Credentials
      # ==========================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ==========================================
      # 3. Login to Amazon ECR
      # ==========================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ==========================================
      # Create ECR Repository if it doesn't exist
      # ==========================================
      - name: Create ECR Repository if it doesn't exist
        run: |
          aws ecr describe-repositories \
            --repository-names ecomerrce2-${{ matrix.service }} \
          || aws ecr create-repository \
            --repository-name ecomerrce2-${{ matrix.service }}

      # ==========================================
      # 4. Run Tests
      # ==========================================
      - name: Run Tests
        run: |
          cd ${{ matrix.service }}

          if [ -f package.json ]; then
            npm install
            npm run test || echo "⚠️ Tests finished with exit code or skipped."
          else
            echo "No package.json found. Skipping tests."
          fi

      # ==========================================
      # 5. Build and Push Docker Image
      # ==========================================
      - name: Build and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ecomerrce2-${{ matrix.service }}
          IMAGE_TAG: latest
        run: |
          echo "Building image for ${{ matrix.service }}..."

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./${{ matrix.service }}

          echo "Pushing image to ECR..."

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ==========================================
      # 6. Deploy to Kubernetes
      # ==========================================
      - name: Setup Kubeconfig and Deploy
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

          kubectl apply -f kubernetes/namespace.yaml

          if [ -f kubernetes/secrets.yaml ]; then
            kubectl apply -f kubernetes/secrets.yaml
          fi

          kubectl apply -f kubernetes/ingress.yaml

          kubectl apply -f kubernetes/mongodb/ || true

          kubectl apply -f kubernetes/${{ matrix.service }}/

      # ==========================================
      # 7. Verify Deployment
      # ==========================================
      - name: Verify Deployment
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

          echo "Restarting deployment..."

          kubectl rollout restart deployment/${{ matrix.service }} -n ecom

          kubectl rollout status deployment/${{ matrix.service }} -n ecom --timeout=180s

  create-artifact:
    name: Package Project Artifact
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package project artifact
        run: |
          tar \
            --exclude='./**/node_modules' \
            --exclude='./.git' \
            --exclude='./terraform/.terraform' \
            -czf project-artifact.tar.gz .

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-artifact-${{ github.sha }}
          path: project-artifact.tar.gz
          retention-days: 7
