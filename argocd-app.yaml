apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Mossab13/mossab30.git'
    path: kubernetes
    targetRevision: HEAD
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ecom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
