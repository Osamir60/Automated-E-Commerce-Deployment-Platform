version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ecom_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ecom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecom_network

  product-service:
    build: ./product-service
    container_name: ecom_product_service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgres://postgres:admin123456@YOUR_DB_ENDPOINT:5432/ecom
      - AWS_REGION=us-east-1
      - AWS_S3_BUCKET=YOUR_S3_BUCKET_NAME
      # IMPORTANT: To allow image uploads, uncomment the next two lines and add your AWS keys:
      - AWS_ACCESS_KEY_ID=YOUR_AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY=YOUR_AWS_SECRET_ACCESS_KEY
    depends_on:
      - postgres
    networks:
      - ecom_network

  search-service:
    build: ./search-service
    container_name: ecom_search_service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/ecom_search
    depends_on:
      - postgres
    networks:
      - ecom_network

  payment-service:
    build: ./payment-service
    container_name: ecom_payment_service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/ecom_payment
    depends_on:
      - postgres
    networks:
      - ecom_network

  email-service:
    build: ./email-service
    container_name: ecom_email_service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - DATABASE_URL=postgres://postgres:admin123456@YOUR_DB_ENDPOINT:5432/ecom
    depends_on:
      - postgres
    networks:
      - ecom_network

  cart-service:
    build: ./cart-service
    container_name: ecom_cart_service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongodb:27017/ecom_cart
    depends_on:
      - postgres
    networks:
      - ecom_network

  frontend:
    build: ./frontend
    container_name: ecom_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_PRODUCT_SERVICE_URL=http://localhost:5001
      - VITE_SEARCH_SERVICE_URL=http://localhost:5002
      - VITE_PAYMENT_SERVICE_URL=http://localhost:5003
      - VITE_EMAIL_SERVICE_URL=http://localhost:5004
      - VITE_CART_SERVICE_URL=http://localhost:5005
    depends_on:
      - product-service
      - search-service
      - payment-service
      - email-service
      - cart-service
    networks:
      - ecom_network
    # For hot reloading during dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  ecom_network:
    driver: bridge

volumes:
  postgres_data:
