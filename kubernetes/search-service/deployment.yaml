apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ecom
  name: search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: 461625527406.dkr.ecr.us-east-1.amazonaws.com/ecomerrce2-search-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/ecom_search"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:5001"
