apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ecom
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: 461625527406.dkr.ecr.us-east-1.amazonaws.com/ecomerrce2-payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/ecom_payment"
